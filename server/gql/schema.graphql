type Programmer {
    id: ID!
    name: String!
    title: String!
    picture: String
    company: String!
    skills: [Skill!]!
}

type Skill {
    id: ID!
    name: String!
    icon: String
    importance: Int!
}

type Query {
    programmers(skill: String!): [Programmer!]!
    # Distinct skill names starting with the given prefix, most-used first,
    # for search autocomplete. An empty prefix returns the top skills overall.
    skills(prefix: String!): [String!]!
}
